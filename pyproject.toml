[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt2ml"
version = "0.2.0.dev0"
description = "Turn a plain-English project idea into a trained ML or DL model, locally."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Kept deliberately small: the CLI's diagnostic commands (init, doctor, status)
# import nothing beyond the stdlib and pydantic, so they still work when the
# heavier agent/ML dependencies are what failed to install.
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
agents = [
    "google-adk",
    "google-genai",
    "python-dotenv",
    "tavily-python",
]
data = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pyarrow>=15",
    "kagglehub",
    "datasets",
    "huggingface_hub",
]
sandbox = [
    "docker==7.1.0",
]
cloud = [
    "runpod",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
prompt2ml = "prompt2ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
